name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PRs are safe to cancel. A main-branch run is not - cancelling
  # mid-`fly deploy` can leave the release command and machine roll half done.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Tests run on the same engine as production. SQLite would pass here and
    # still hide the things that actually break: select_for_update() in
    # ai_insights/jobs.py is a genuine row lock on Postgres and close to a
    # no-op on SQLite, and that lock is what stops a user's second tab from
    # spawning a duplicate generation.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sleep_tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sleep_tracker
      DJANGO_SECRET_KEY: ci-secret-not-used-outside-tests
      DEBUG: 'false'
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Left unset on purpose: no Firebase or Fitbit credentials. The suite
      # passes without them (settings default every one to ''), which is the
      # property that keeps CI runnable from forks.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        # Fails if a model changed without a matching migration. Without this
        # the mistake surfaces as a failed release_command on deploy instead.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # `npm run build` runs `tsc -b` first, so this is also the typecheck.
        # No VITE_* values needed: src/config.ts defaults them, and this
        # artifact is thrown away - the deploy job rebuilds with real config.
        run: npm run build

  deploy-backend:
    name: Deploy backend (Fly.io)
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --remote-only builds on Fly's builder, so no Docker layer cache to
        # warm here. Migrations run via release_command in fly.toml; if they
        # exit non-zero, Fly aborts before any machine takes traffic.
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages)
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        # Vite inlines VITE_* at build time, so these must be present *here*,
        # not on the host. They are repo `vars`, not `secrets`, because
        # Firebase web config ships to every browser in the bundle - treating
        # it as secret buys nothing and makes rotation look scarier than it is.
        # The Firebase API key is an identifier; access is controlled by
        # Firebase Auth rules and authorised domains.
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=sleepinsight
